            text-align: center;

        .access-message {
            text-align: center;
            padding: 80px 20px;
            display: none;

        .access-message h2 {
            color: #ff4444;
            margin-bottom: 15px;
        }

        .admin-panel {
            display: none;
        }

            margin-bottom: 35px;

            border-radius: 15px;
            background: rgba(255,255,255,.05);

        .price-section h2 {
            margin-bottom: 20px;
        }

        .price-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 15px;
        }

        .price-box {
            padding: 15px;
            border-radius: 12px;
            background: rgba(0,0,0,.15);
        }

        .price-box label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .price-box input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255,255,255,.2);
            background: rgba(0,0,0,.25);
            color: inherit;
            outline: none;
        }

        .save-button {
            display: block;
            width: 100%;
            max-width: 400px;
            margin: 30px auto;
            padding: 15px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
        }

        .status-message {
            text-align: center;
            margin-top: 15px;
            font-weight: bold;
        }
    </style>
</head>

<script type="module">

import { auth, db } from "./js/firebase.js";

import {
    onAuthStateChanged
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-auth.js";

import {
    doc,
    getDoc,
    setDoc
} from "https://www.gstatic.com/firebasejs/12.0.0/firebase-firestore.js";


/* ==========================================
   ADMIN UID
========================================== */

const ADMIN_UID =
    "5WxwzHzd2xYFj2K6Crz3LvrSV013";


/* ==========================================
   ELEMENTS
========================================== */

const adminPanel =
    document.getElementById("adminPanel");

const accessMessage =
    document.getElementById("accessMessage");

const adminUser =
    document.getElementById("adminUser");

const saveButton =
    document.getElementById("savePrices");

const statusMessage =
    document.getElementById("statusMessage");


/* ==========================================
   PRICE IDS
========================================== */

const priceIds = [

    "mlbb_257",
    "mlbb_343",
    "mlbb_429",
    "mlbb_514",
    "mlbb_600",
    "mlbb_706",
    "mlbb_878",
    "mlbb_963",
    "mlbb_1049",
    "mlbb_1135",
    "mlbb_1412",
    "mlbb_2195",
    "mlbb_3688",
    "mlbb_5532",
    "mlbb_6598",
    "mlbb_9288",

    "weekly_pass",

    "pubg_60",
    "pubg_120",
    "pubg_180",
    "pubg_240",
    "pubg_325",
    "pubg_385",
    "pubg_660",
    "pubg_720",
    "pubg_840",
    "pubg_985",
    "pubg_1320",
    "pubg_1800",
    "pubg_3800",
    "pubg_8100",

    "pubg_first_purchase",
    "pubg_material_pack",
    "pubg_prime_1_month",
    "pubg_prime_plus_1_month"

];


/* ==========================================
   CHECK ADMIN
========================================== */

function checkAdmin(user) {

    if (!user) {

        adminPanel.style.display = "none";

        accessMessage.style.display = "block";

        adminUser.textContent =
            "Not logged in";

        return false;
    }


    /* USER UID CHECK */

    if (user.uid !== ADMIN_UID) {

        adminPanel.style.display = "none";

        accessMessage.style.display = "block";

        adminUser.textContent =
            "Access Denied";

        console.warn(
            "ROVEX STORE: Unauthorized user",
            user.uid
        );

        return false;
    }


    /* ADMIN */

    adminPanel.style.display = "block";

    accessMessage.style.display = "none";

    adminUser.textContent =
        "Logged in as: " +
        (user.email || "Admin");


    console.log(
        "ROVEX STORE ADMIN ACCESS GRANTED"
    );

    console.log(
        "Admin UID:",
        user.uid
    );

    return true;
}


/* ==========================================
   LOAD PRICES
========================================== */

async function loadPrices() {

    try {

        const priceRef =
            doc(db, "products", "prices");

        const priceSnap =
            await getDoc(priceRef);


        if (!priceSnap.exists()) {

            console.log(
                "No prices found."
            );

            return;
        }


        const prices =
            priceSnap.data();


        priceIds.forEach(id => {

            const input =
                document.getElementById(id);

            if (!input) return;


            if (
                prices[id] !== undefined &&
                prices[id] !== null
            ) {

                input.value =
                    prices[id];

            }

        });


        /*
           Weekly Pass compatibility
           for mlbb.html
        */

        const weeklyInput =
            document.getElementById(
                "weekly_pass"
            );


        if (
            weeklyInput &&
            prices.mlbb_weekly_pass !== undefined
        ) {

            weeklyInput.value =
                prices.mlbb_weekly_pass;

        }


        console.log(
            "Prices loaded successfully"
        );

    } catch (error) {

        console.error(
            "Load prices error:",
            error
        );

        statusMessage.textContent =
            "❌ Failed to load prices";

    }

}


/* ==========================================
   SAVE ALL PRICES
========================================== */

async function saveAllPrices() {

    saveButton.disabled = true;

    statusMessage.textContent =
        "Saving prices...";


    try {

        const prices = {};


        priceIds.forEach(id => {

            const input =
                document.getElementById(id);

            if (!input) return;


            const value =
                input.value.trim();


            prices[id] =
                value === ""
                    ? 0
                    : Number(value);

        });


        /*
           Save Weekly Pass
           using both IDs
        */

        prices.mlbb_weekly_pass =
            prices.weekly_pass;


        const priceRef =
            doc(db, "products", "prices");


        await setDoc(
            priceRef,
            prices,
            { merge: true }
        );


        statusMessage.textContent =
            "✅ All prices saved successfully!";


        console.log(
            "Prices saved:",
            prices
        );


    } catch (error) {

        console.error(
            "Save prices error:",
            error
        );


        if (
            error.code ===
            "permission-denied"
        ) {

            statusMessage.textContent =
                "❌ Permission denied. Check Firebase Rules.";

        } else {

            statusMessage.textContent =
                "❌ Error saving prices.";

        }

    }


    saveButton.disabled = false;

}


/* ==========================================
   BUTTON
========================================== */

saveButton.addEventListener(
    "click",
    saveAllPrices
);


/* ==========================================
   AUTH STATE
========================================== */

onAuthStateChanged(
    auth,
    async (user) => {

        const isAdmin =
            checkAdmin(user);


        if (isAdmin) {

            await loadPrices();

        }

    }
);

</script>
